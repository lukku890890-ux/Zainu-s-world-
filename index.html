<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Zainu's World — Multiplayer</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#76c9ee;font-family:Arial}canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}
#title{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:23px;font-weight:bold}
#status{position:absolute;top:14px;left:12px;background:#0008;padding:7px 10px;border-radius:14px;font-size:12px}
#count{position:absolute;top:48px;left:12px;background:#0008;padding:6px 10px;border-radius:14px;font-size:12px}
#chat{position:absolute;left:12px;bottom:82px;width:280px;max-height:180px;overflow:hidden;font-size:13px}
.msg{margin:4px 0}
#chatInput{pointer-events:auto;position:absolute;left:12px;bottom:25px;width:250px;padding:10px 13px;border:0;border-radius:20px;outline:0}
#joy{pointer-events:auto;position:absolute;left:18px;bottom:18px;width:105px;height:105px;border-radius:50%;background:#fff3;border:2px solid #fff8}
#stick{position:absolute;width:48px;height:48px;left:27px;top:27px;border-radius:50%;background:#fff9}
#look{pointer-events:auto;position:absolute;right:0;top:0;width:52%;height:100%}
#login{pointer-events:auto;position:absolute;inset:0;background:linear-gradient(#39a9d8,#102d45);display:flex;align-items:center;justify-content:center;text-align:center}
.card{background:#071522e8;padding:28px;border-radius:22px;width:min(330px,80%);box-shadow:0 15px 45px #0008}
input,button{font:inherit}#name{padding:12px;border-radius:18px;border:0;width:85%;box-sizing:border-box;margin:10px}
button{padding:12px 24px;border:0;border-radius:20px;background:#ffd447;font-weight:bold}
</style></head><body><div id="login"><div class="card"><h1>🌍 Zainu's World</h1><p>Real-time multiplayer browser game</p><input id="name" placeholder="Your player name" maxlength="20"><br><button id="join">JOIN WORLD</button></div></div>
<div id="ui"><div id="title">🌍 Zainu's World</div><div id="status">Connecting…</div><div id="count">Players: 0</div><div id="chat"></div><input id="chatInput" placeholder="Live chat…"><div id="joy"><div id="stick"></div></div><div id="look"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
let scene,camera,renderer,me,ws,myId="",yaw=0,lastSend=0;const others=new Map(),canvas=document.querySelector("canvas");
function world(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x76c9ee);scene.fog=new THREE.Fog(0x76c9ee,50,160);
 camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 scene.add(new THREE.HemisphereLight(0xcff3ff,0x3d5d30,2));
 let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(30,70,20);scene.add(sun);
 let g=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshStandardMaterial({color:0x4caf50}));g.rotation.x=-Math.PI/2;scene.add(g);
 for(let i=0;i<50;i++)tree((Math.random()-.5)*190,(Math.random()-.5)*190);
 for(let i=0;i<10;i++)house((Math.random()-.5)*160,(Math.random()-.5)*160);
 me=makePlayer(0x1976d2);scene.add(me);me.position.set(0,0,8);animate();
}
function tree(x,z){let q=new THREE.Group(),a=new THREE.Mesh(new THREE.CylinderGeometry(.18,.25,2,8),new THREE.MeshStandardMaterial({color:0x795548})),b=new THREE.Mesh(new THREE.SphereGeometry(1.2,10,10),new THREE.MeshStandardMaterial({color:0x16863a}));a.position.y=1;b.position.y=2.3;q.add(a,b);q.position.set(x,0,z);scene.add(q)}
function house(x,z){let q=new THREE.Group(),a=new THREE.Mesh(new THREE.BoxGeometry(5,3.5,5),new THREE.MeshStandardMaterial({color:0xffd9aa})),b=new THREE.Mesh(new THREE.ConeGeometry(4,2,4),new THREE.MeshStandardMaterial({color:0xb23b3b}));a.position.y=1.75;b.position.y=4.5;b.rotation.y=Math.PI/4;q.add(a,b);q.position.set(x,0,z);scene.add(q)}
function makePlayer(col){let q=new THREE.Group(),b=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.9,5,10),new THREE.MeshStandardMaterial({color:col})),h=new THREE.Mesh(new THREE.SphereGeometry(.38,16,16),new THREE.MeshStandardMaterial({color:0xffc58a}));b.position.y=1;h.position.y=1.85;q.add(b,h);return q}
function addOther(p){let q=makePlayer(0xff7043);q.position.set(p.x,0,p.z);q.rotation.y=p.rot||0;scene.add(q);others.set(p.id,q)}
function chat(name,text){let d=document.createElement("div");d.className="msg";d.textContent=name+": "+text;document.querySelector("#chat").prepend(d);setTimeout(()=>d.remove(),9000)}
function connect(name){
 if(!location.host){document.querySelector("#status").textContent="⚠️ Multiplayer needs the online server";return}
 const proto=location.protocol==="https:"?"wss":"ws";ws=new WebSocket(proto+"://"+location.host);
 ws.onerror=()=>document.querySelector("#status").textContent="⚠️ Server unavailable";
 ws.onopen=()=>{document.querySelector("#status").textContent="🟢 Online";ws.send(JSON.stringify({type:"name",name}))};
 ws.onclose=()=>document.querySelector("#status").textContent="🔴 Disconnected";
 ws.onmessage=e=>{let m=JSON.parse(e.data);
  if(m.type==="welcome"){myId=m.id;m.players.filter(p=>p.id!==myId).forEach(addOther);document.querySelector("#count").textContent="Players: "+m.players.length}
  if(m.type==="join"){addOther(m.player);chat("System",m.player.name+" joined")}
  if(m.type==="leave"){let q=others.get(m.id);if(q){scene.remove(q);others.delete(m.id)}chat("System","A player left")}
  if(m.type==="move"){if(m.player.id===myId)return;let q=others.get(m.player.id);if(!q)addOther(m.player);else{q.position.x=m.player.x;q.position.z=m.player.z;q.rotation.y=m.player.rot}}
  if(m.type==="chat")chat(m.name,m.text);
  document.querySelector("#count").textContent="Players: "+(others.size+1);
 };
}
let keys={};addEventListener("keydown",e=>{keys[e.key]=true;if(e.key==="Enter"){let i=chatInput;if(document.activeElement===i){if(i.value.trim())ws?.send(JSON.stringify({type:"chat",text:i.value}));i.value=""}}});addEventListener("keyup",e=>keys[e.key]=false);
function animate(){requestAnimationFrame(animate);if(!me)return;let x=0,z=0;if(keys.w||keys.ArrowUp)z=-1;if(keys.s||keys.ArrowDown)z=1;if(keys.a||keys.ArrowLeft)x=-1;if(keys.d||keys.ArrowRight)x=1;if(x||z){let l=Math.hypot(x,z);x/=l;z/=l;me.position.x+=x*.16;me.position.z+=z*.16;me.rotation.y=yaw;let now=performance.now();if(ws?.readyState===1&&now-lastSend>50){ws.send(JSON.stringify({type:"move",x:me.position.x,z:me.position.z,rot:yaw}));lastSend=now}}
camera.position.set(me.position.x-Math.sin(yaw)*5,me.position.y+3,me.position.z-Math.cos(yaw)*5);camera.lookAt(me.position.x,me.position.y+1,me.position.z);renderer.render(scene,camera)}
let joy=document.querySelector("#joy"),stick=document.querySelector("#stick"),j=false;
joy.addEventListener("pointerdown",e=>{j=true;joy.setPointerCapture(e.pointerId)});joy.addEventListener("pointermove",e=>{if(!j)return;let r=joy.getBoundingClientRect(),x=e.clientX-r.left-52,y=e.clientY-r.top-52,d=Math.min(40,Math.hypot(x,y)),a=Math.atan2(y,x);stick.style.transform=`translate(${Math.cos(a)*d*.68}px,${Math.sin(a)*d*.68}px)`;if(me){let dx=Math.cos(a)*d/40,dy=Math.sin(a)*d/40;me.position.x+=dx*.16;me.position.z+=dy*.16;me.rotation.y=yaw;let now=performance.now();if(ws?.readyState===1&&now-lastSend>50){ws.send(JSON.stringify({type:"move",x:me.position.x,z:me.position.z,rot:yaw}));lastSend=now}}});
joy.addEventListener("pointerup",()=>{j=false;stick.style.transform=""});
let lx=0;document.querySelector("#look").addEventListener("pointerdown",e=>lx=e.clientX);document.querySelector("#look").addEventListener("pointermove",e=>{if(!lx)return;yaw-=(e.clientX-lx)*.008;lx=e.clientX});document.querySelector("#look").addEventListener("pointerup",()=>lx=0);
document.querySelector("#join").onclick=()=>{let n=document.querySelector("#name").value.trim()||"Player";document.querySelector("#login").remove();world();connect(n)};
addEventListener("resize",()=>{if(camera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
</script></body></html>
